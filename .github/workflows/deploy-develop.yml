# Deploy do export estático (`out/`) para a Hostinger.
# Roda só em `develop` (staging). Produção (`main`) fica para depois.
#
# Secrets: FTP_USERNAME, FTP_PASSWORD
#          FTP_SERVER (secret ou variable: IP ou domínio, sem ftp://)
# Variables: NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_API_URL
#            FTP_SERVER_DIR (opcional, default /public_html/)
#            STATIC_SLUGS (opcional)
# Ver docs/ops/dev-setup.md e docs/decisions/ADR-017-github-actions-hostinger.md

name: Deploy develop (Hostinger)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build e FTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      STATIC_SLUGS: ${{ vars.STATIC_SLUGS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir variáveis públicas
        run: |
          missing=0
          [ -n "$NEXT_PUBLIC_APP_URL" ] || { echo "Falta variable NEXT_PUBLIC_APP_URL"; missing=1; }
          [ -n "$NEXT_PUBLIC_API_URL" ] || { echo "Falta variable NEXT_PUBLIC_API_URL"; missing=1; }
          exit "$missing"

      - name: Conferir e normalizar FTP
        id: ftp
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          [ -n "$FTP_SERVER" ] || { echo "Falta secret/variable FTP_SERVER"; missing=1; }
          [ -n "$FTP_USERNAME" ] || { echo "Falta secret FTP_USERNAME"; missing=1; }
          [ -n "$FTP_PASSWORD" ] || { echo "Falta secret FTP_PASSWORD"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

          # hPanel copia "ftp://IP" ou "ftp://ftp.dominio.com" — o cliente FTP quer só o host.
          host="$(printf '%s' "$FTP_SERVER" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          host="${host#ftp://}"
          host="${host#ftps://}"
          host="${host#sftp://}"
          host="${host%%/*}"
          # "1.2.3.4:21" → IP; não cortar IPv6 (vários ':').
          if [[ "$host" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+:[0-9]+$ ]]; then
            host="${host%:*}"
          fi
          echo "::add-mask::$host"
          echo "host=$host" >> "$GITHUB_OUTPUT"

          # IP não precisa de DNS. getent hosts em IPv4 sem PTR falha (exit 2).
          if [[ "$host" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FTP host é IPv4; DNS ignorado."
          elif getent ahostsv4 "$host" >/dev/null; then
            echo "FTP host resolve em IPv4."
          else
            echo "FTP_SERVER não resolve no DNS (depois de tirar ftp://)."
            echo "Na Hostinger use o IP do hPanel (ftp://IP vira só o IP aqui) ou um hostname com A record."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (export estático)
        run: pnpm build

      - name: Conferir out/ e .htaccess
        run: |
          test -f out/index.html
          test -f out/.htaccess

      - name: Deploy FTP (Hostinger)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          dangerous-clean-slate: true
          timeout: 600000
