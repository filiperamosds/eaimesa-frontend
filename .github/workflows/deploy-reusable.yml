# Reuso interno. Não dispara sozinho.
# Callers: deploy-develop.yml, deploy-main.yml
# Ver docs/ops/dev-setup.md e docs/decisions/ADR-038-front-deploy-tarball-ssh.md

name: Deploy Hostinger (reusable)

on:
  workflow_call:
    inputs:
      remote_dir:
        description: Pasta no servidor (REMOTE_TARGET_FRONT_* ou FTP_SERVER_DIR_*)
        required: true
        type: string
      app_url:
        description: NEXT_PUBLIC_APP_URL deste ambiente
        required: true
        type: string
      api_url:
        description: NEXT_PUBLIC_API_URL deste ambiente
        required: true
        type: string

concurrency:
  group: deploy-${{ github.ref_name }}
  # Extract a meio deixa HTML a meio; não cancelar.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build e SSH (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: ${{ inputs.app_url }}
      NEXT_PUBLIC_API_URL: ${{ inputs.api_url }}
      API_URL: ${{ inputs.api_url }}
      STATIC_SLUGS: ${{ vars.STATIC_SLUGS }}
      DEPLOY_HOST: ${{ secrets.REMOTE_HOST || vars.REMOTE_HOST || vars.FTP_SERVER || secrets.FTP_SERVER }}
      DEPLOY_USER: ${{ secrets.REMOTE_USER || vars.REMOTE_USER }}
      DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY || vars.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir variáveis públicas
        run: |
          missing=0
          [ -n "$NEXT_PUBLIC_APP_URL" ] || { echo "Falta APP_URL deste ambiente"; missing=1; }
          [ -n "$NEXT_PUBLIC_API_URL" ] || { echo "Falta API_URL deste ambiente"; missing=1; }
          exit "$missing"

      - name: Validar SSH e pasta remota
        env:
          H: ${{ env.DEPLOY_HOST }}
          U: ${{ env.DEPLOY_USER }}
          K: ${{ env.DEPLOY_KEY }}
          D: ${{ inputs.remote_dir }}
        run: |
          missing=0
          if [ -z "$H" ] || [ -z "$U" ] || [ -z "$K" ]; then
            echo "::error::Defina SSH_PRIVATE_KEY, REMOTE_HOST (ou FTP_SERVER) e REMOTE_USER — os mesmos do repo da API."
            missing=1
          fi
          if [ -n "$K" ]; then
            case "$K" in
              *BEGIN*OPENSSH*PRIVATE*KEY*) ok=1 ;;
              *BEGIN*RSA*PRIVATE*KEY*) ok=1 ;;
              *BEGIN*EC*PRIVATE*KEY*) ok=1 ;;
              *) ok=0 ;;
            esac
            if [ "${ok:-0}" != 1 ]; then
              echo "::error::SSH_PRIVATE_KEY deve incluir o bloco PEM (BEGIN … PRIVATE KEY até END …)."
              missing=1
            fi
          fi
          if [ -z "$D" ]; then
            echo "::error::Falta a pasta remota (REMOTE_TARGET_FRONT_* ou FTP_SERVER_DIR_*)."
            missing=1
          fi
          if [[ "$H" == *://* ]] || [[ "$H" == */* ]]; then
            echo "::error::REMOTE_HOST deve ser só IP ou hostname (sem caminho)."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          d="$D"
          d="${d%"${d##*[![:space:]]}"}"
          d="${d#"${d%%[![:space:]]*}"}"
          d="${d%/}"
          echo "REMOTE_TARGET_FRONT=$d" >> "$GITHUB_ENV"
          echo "Deploy SSH → $H:$d (branch ${GITHUB_REF_NAME})"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (export estático)
        run: pnpm build

      - name: Conferir out/ e .htaccess
        run: |
          test -f out/index.html
          test -f out/.htaccess

      - name: Pack out/
        run: |
          tar -czf "$RUNNER_TEMP/front-deploy.tgz" -C out .
          cp "$RUNNER_TEMP/front-deploy.tgz" "$GITHUB_WORKSPACE/front-deploy.tgz"
          ls -lh "$GITHUB_WORKSPACE/front-deploy.tgz"

      - name: Upload bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ vars.REMOTE_PORT == '' && 22 || vars.REMOTE_PORT }}
          timeout: 5m
          source: front-deploy.tgz
          target: ${{ env.REMOTE_TARGET_FRONT }}

      - name: Extract on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          REMOTE_PATH: ${{ env.REMOTE_TARGET_FRONT }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ vars.REMOTE_PORT == '' && 22 || vars.REMOTE_PORT }}
          timeout: 2m
          command_timeout: 10m
          envs: REMOTE_PATH
          script: |
            set -euo pipefail
            if [ -d "$REMOTE_PATH" ]; then
              cd "$REMOTE_PATH"
            elif [ -d "$HOME/$REMOTE_PATH" ]; then
              cd "$HOME/$REMOTE_PATH"
            else
              mkdir -p "$HOME/$REMOTE_PATH"
              cd "$HOME/$REMOTE_PATH"
            fi
            DEST="$(pwd)"
            test -f front-deploy.tgz || { echo "Falta front-deploy.tgz em $DEST"; ls -la; exit 1; }

            RELEASE="$DEST/.release-front"
            rm -rf "$RELEASE"
            mkdir -p "$RELEASE"
            tar -xzf front-deploy.tgz -C "$RELEASE"
            rm -f front-deploy.tgz

            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete \
                --exclude '.release-front' \
                --exclude 'cgi-bin' \
                --exclude '.well-known' \
                "$RELEASE"/ "$DEST"/
            else
              cp -a "$RELEASE"/. "$DEST"/
            fi
            rm -rf "$RELEASE"
            test -f "$DEST/index.html"
            echo "Front extraído em $DEST"
