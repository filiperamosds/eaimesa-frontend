name: Deploy develop (Hostinger)

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      ftp_dir: ${{ vars.FTP_SERVER_DIR_DEV }}
      app_url: ${{ vars.NEXT_PUBLIC_APP_URL }}
      api_url: ${{ vars.NEXT_PUBLIC_API_URL }}
    secrets: inherit
